{% extends 'layout.html' %} {% block content %}

<div class="filters">
  <a href="/"><button class="btn">All</button></a>
  <a href="/SSA"><button class="btn">Spyros Adventure</button></a>
  <a href="/SG"><button class="btn">Giants</button></a>
  <a href="/SF"><button class="btn">SwapForce</button></a>
  <a href="/STT"><button class="btn">Trap Team</button></a>
  <a href="/SS"><button class="btn">SuperChargers</button></a>
  <a href="/SI"><button class="btn">Imaginotores</button></a>
</div>

<div class="container">
  {% for row in content %}
  <div class="card">
    <img
      class="card-image"
      src="{{ row[4] }}"
      alt="Product image for the {{ row[1] }} VSCode extension."
    />
    <h1 class="card-name">{{ row[1] }}</h1>
    <p class="card-about">{{ row[3] }}</p>
    <a class="card-link" href="{{ row[2] }}"
      ><button class="btn">Read More</button></a
    >
  </div>
  {% endfor %}
</div>
{% endblock %}
